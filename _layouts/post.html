---
layout: page
---
  <div class="container-fluid mb-1 p-0 bg-light">
      <div class="container-fluid row pt-5">
        <div class="offset-lg-4 col-lg-4" id="missions">
          <h1 class="mb-0 mt-0">{{ page.title }}</h1>
<p >{{ page.date | date_to_string }} - {{ page.author }}</p>
    {{ content }}
    <div class="d-flex justify-content-between mt-5 mb-2">

          {% if page.previous %} 
        <a rel="prev" href="{{ page.previous.url }}">&larr; {{page.previous.title}} (Older)</a>
        {% else %}
        <a></a>
    {% endif %}
    {% if page.next %} 
        <a rel="next" href="{{ page.next.url }}">{{page.next.title}} (Newer) &rarr;</a>
    {% endif %}
    </div>
        </div>
      </div>
  </div>
