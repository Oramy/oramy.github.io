title: Mother Machine
role: Game Designer & UI Tech Artist
description: Grimpez, sautez et explorez des grottes extraterrestres générées procéduralement dans ce jeu de plateforme action-RPG en coop jusqu'à 4 joueurs. Personnalisez votre gremlin, semez le désordre et débloquez tout un tas de mutations afin d’affiner votre style de jeu et votre rôle au sein du groupe !
